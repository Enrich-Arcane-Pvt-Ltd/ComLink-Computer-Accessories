<!DOCTYPE html><html><head><style>
body { background: #0b101b; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px; }
.row-card { display: flex; align-items: center; gap: 20px; background: #131a26; padding: 10px 20px; border-radius: 12px; border: 1px solid #22d3ee44; }
.anim-box { width: 120px; height: 120px; position: relative; background: radial-gradient(circle, #22d3ee11, transparent); border-radius: 8px; border: 1px solid #22d3ee22; }
.anim-img { width: 120px; height: 120px; object-fit: contain; }
.strip { display: flex; gap: 4px; overflow-x: auto; }
.strip img { width: 60px; height: 60px; background: #0004; border-radius: 4px; }
</style></head><body><h1>Robot Sprite Sheet Row Animations</h1><div class='row-card'><div><h3>Row 0</h3></div><div class='anim-box'><img id='anim_0' class='anim-img' src='/images/bot/robot/frames/row0_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row0_frame0.png'><img src='/images/bot/robot/frames/row0_frame1.png'><img src='/images/bot/robot/frames/row0_frame2.png'><img src='/images/bot/robot/frames/row0_frame3.png'><img src='/images/bot/robot/frames/row0_frame4.png'><img src='/images/bot/robot/frames/row0_frame5.png'><img src='/images/bot/robot/frames/row0_frame6.png'><img src='/images/bot/robot/frames/row0_frame7.png'></div></div><div class='row-card'><div><h3>Row 1</h3></div><div class='anim-box'><img id='anim_1' class='anim-img' src='/images/bot/robot/frames/row1_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row1_frame0.png'><img src='/images/bot/robot/frames/row1_frame1.png'><img src='/images/bot/robot/frames/row1_frame2.png'><img src='/images/bot/robot/frames/row1_frame3.png'><img src='/images/bot/robot/frames/row1_frame4.png'><img src='/images/bot/robot/frames/row1_frame5.png'><img src='/images/bot/robot/frames/row1_frame6.png'><img src='/images/bot/robot/frames/row1_frame7.png'></div></div><div class='row-card'><div><h3>Row 2</h3></div><div class='anim-box'><img id='anim_2' class='anim-img' src='/images/bot/robot/frames/row2_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row2_frame0.png'><img src='/images/bot/robot/frames/row2_frame1.png'><img src='/images/bot/robot/frames/row2_frame2.png'><img src='/images/bot/robot/frames/row2_frame3.png'><img src='/images/bot/robot/frames/row2_frame4.png'><img src='/images/bot/robot/frames/row2_frame5.png'><img src='/images/bot/robot/frames/row2_frame6.png'><img src='/images/bot/robot/frames/row2_frame7.png'></div></div><div class='row-card'><div><h3>Row 3</h3></div><div class='anim-box'><img id='anim_3' class='anim-img' src='/images/bot/robot/frames/row3_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row3_frame0.png'><img src='/images/bot/robot/frames/row3_frame1.png'><img src='/images/bot/robot/frames/row3_frame2.png'><img src='/images/bot/robot/frames/row3_frame3.png'><img src='/images/bot/robot/frames/row3_frame4.png'><img src='/images/bot/robot/frames/row3_frame5.png'><img src='/images/bot/robot/frames/row3_frame6.png'><img src='/images/bot/robot/frames/row3_frame7.png'></div></div><div class='row-card'><div><h3>Row 4</h3></div><div class='anim-box'><img id='anim_4' class='anim-img' src='/images/bot/robot/frames/row4_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row4_frame0.png'><img src='/images/bot/robot/frames/row4_frame1.png'><img src='/images/bot/robot/frames/row4_frame2.png'><img src='/images/bot/robot/frames/row4_frame3.png'><img src='/images/bot/robot/frames/row4_frame4.png'><img src='/images/bot/robot/frames/row4_frame5.png'><img src='/images/bot/robot/frames/row4_frame6.png'><img src='/images/bot/robot/frames/row4_frame7.png'></div></div><div class='row-card'><div><h3>Row 5</h3></div><div class='anim-box'><img id='anim_5' class='anim-img' src='/images/bot/robot/frames/row5_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row5_frame0.png'><img src='/images/bot/robot/frames/row5_frame1.png'><img src='/images/bot/robot/frames/row5_frame2.png'><img src='/images/bot/robot/frames/row5_frame3.png'><img src='/images/bot/robot/frames/row5_frame4.png'><img src='/images/bot/robot/frames/row5_frame5.png'><img src='/images/bot/robot/frames/row5_frame6.png'><img src='/images/bot/robot/frames/row5_frame7.png'></div></div><div class='row-card'><div><h3>Row 6</h3></div><div class='anim-box'><img id='anim_6' class='anim-img' src='/images/bot/robot/frames/row6_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row6_frame0.png'><img src='/images/bot/robot/frames/row6_frame1.png'><img src='/images/bot/robot/frames/row6_frame2.png'><img src='/images/bot/robot/frames/row6_frame3.png'><img src='/images/bot/robot/frames/row6_frame4.png'><img src='/images/bot/robot/frames/row6_frame5.png'><img src='/images/bot/robot/frames/row6_frame6.png'><img src='/images/bot/robot/frames/row6_frame7.png'></div></div><div class='row-card'><div><h3>Row 7</h3></div><div class='anim-box'><img id='anim_7' class='anim-img' src='/images/bot/robot/frames/row7_frame0.png'></div><div class='strip'><img src='/images/bot/robot/frames/row7_frame0.png'><img src='/images/bot/robot/frames/row7_frame1.png'><img src='/images/bot/robot/frames/row7_frame2.png'><img src='/images/bot/robot/frames/row7_frame3.png'><img src='/images/bot/robot/frames/row7_frame4.png'><img src='/images/bot/robot/frames/row7_frame5.png'><img src='/images/bot/robot/frames/row7_frame6.png'><img src='/images/bot/robot/frames/row7_frame7.png'></div></div><script>
for (let r = 0; r < 8; r++) {
    let frame = 0;
    const img = document.getElementById("anim_" + r);
    setInterval(() => {
        frame = (frame + 1) % 8;
        img.src = "/images/bot/robot/frames/row" + r + "_frame" + frame + ".png";
    }, 125);
}
</script></body></html>
